name: Deploy Next.js static site to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/website-services
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      REPO_NAME: "syntra-studio-site"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (include devDependencies)
        run: npm ci --include=dev

      - name: Build (Next.js static export via output: export)
        run: npm run build

      - name: Debug export output
        shell: bash
        run: |
          echo "Top-level out/ contents:"
          ls -la out || true
          echo "Repo folder out/${REPO_NAME} contents:"
          ls -la "out/${REPO_NAME}" || true

      - name: Add .nojekyll
        run: touch "out/${REPO_NAME}/.nojekyll"

      - name: Upload artifact (publish repo subfolder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "out/${{ env.REPO_NAME }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
