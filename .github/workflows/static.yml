name: Deploy Next.js static site to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/website-services
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies (include devDependencies)
        run: npm ci --include=dev

      - name: Build (Next.js static export via output: export)
        run: npm run build

      - name: Verify export output exists
        shell: bash
        run: |
          echo "Listing out/ directory:"
          ls -la out || true
          if [ ! -f out/index.html ]; then
            echo "ERROR: out/index.html not found. Static export did not produce HTML."
            exit 1
          fi

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
